[package]
name = "codex-tauri"
version = "0.1.0"
description = "Codex desktop shell (Tauri) with a self-developed in-process kernel"
authors = ["Codex Contributors"]
edition = "2021"
rust-version = "1.77"
workspace = ".."

[lib]
name = "codex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri shell ─────────────────────────────────────────────────────────────
# Pinned exact: a floating "2" once resolved tauri-runtime-wry 2.10.1 against
# newer tauri-runtime/wry and broke the build (E0046 missing
# eval_script_with_callback, E0277 new-window handler Send-ness).
tauri = { version = "=2.11.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

# ── serialization ───────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── async runtime ───────────────────────────────────────────────────────────
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "net",
] }
# Cancellation for kernel turns (`kernel::state`). A turn runs on a detached
# task and needs a deterministic way to stop; `CancellationToken` is the tested
# primitive for that and avoids a hand-rolled atomic/notify race.
tokio-util = { version = "0.7", default-features = false }
# `kernel::provider::ModelProvider` is used as `dyn ModelProvider`, so its async
# method needs `async_trait` — native async-fn-in-trait is not object-safe.
async-trait = "0.1"

# ── utilities ───────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
cron = "0.12"

# ── logging ─────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── HTTP ────────────────────────────────────────────────────────────────────
# Used by `kernel::http_provider` (the real model backend) and
# `commands::kernel_config::probe_provider`.
#
# `stream` is required: the provider consumes Server-Sent Events incrementally
# via `Response::bytes_stream()`. Without it, reqwest buffers the whole body and
# the UI would show nothing until the answer finished.
reqwest = { version = "0.12", features = ["json", "stream"] }
# `bytes` is the item type of the byte stream; naming it directly keeps the SSE
# decoder readable.
bytes = "1"

[features]
default = []

# Opt into the workspace lint set. Without this line the root
# `[workspace.lints.clippy]` table is inert — a member only inherits lints when
# it says `workspace = true` here.
[lints]
workspace = true

# NOTE: Cargo only honors [profile.*] at the workspace root. Do not add
# [profile.release] here - it is ignored (CI log: "profiles for the non root
# package will be ignored"). The effective profiles live in the root Cargo.toml.
