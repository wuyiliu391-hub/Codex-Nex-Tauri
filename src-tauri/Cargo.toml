[package]
name = "codex-tauri"
version = "0.1.0"
description = "Codex desktop shell (Tauri) powered by official codex-app-server sidecar"
authors = ["Codex Contributors"]
edition = "2021"
rust-version = "1.77"
workspace = ".."

[lib]
name = "codex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned exact: floating "2" resolved tauri-runtime-wry 2.10.1 against newer
# tauri-runtime/wry and broke the build (E0046 missing
# eval_script_with_callback, E0277 new-window handler Send-ness).
# 2.11.5/2.11.4 is the coherent, high-download set (2026-06/07).
# Bump deliberately, never float, until a Cargo.lock covers src-tauri.
tauri = { version = "=2.11.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4"
cron = "0.12"
walkdir = "2"
regex = "1"

# ─── In-process native engine backend ─────────────────────────────────────────
codex-app-server          = { path = "../src/backend/app-server",          optional = true }
codex-app-server-protocol = { path = "../src/backend/app-server-protocol", optional = true }
codex-app-server-client   = { path = "../src/backend/app-server-client",   optional = true }
codex-protocol            = { path = "../src/backend/protocol",            optional = true }
codex-core                = { path = "../src/backend/core",                optional = true }
codex-config              = { path = "../src/backend/config",              optional = true }
codex-arg0                = { path = "../src/backend/arg0",                optional = true }
codex-exec-server         = { path = "../src/backend/exec-server",         optional = true }
codex-feedback            = { path = "../src/backend/feedback",            optional = true }

[features]
# TEMP (pre-v1): shell-only default. The in-process native backend under
# src/backend is kept intact but NOT compiled by default — frontend work is
# still in progress and v1 must not pay backend build time in CI.
# Re-enable locally with: cargo tauri dev --features in-process
default = []
in-process = [
    "dep:codex-app-server",
    "dep:codex-app-server-protocol",
    "dep:codex-app-server-client",
    "dep:codex-protocol",
    "dep:codex-core",
    "dep:codex-config",
    "dep:codex-arg0",
    "dep:codex-exec-server",
    "dep:codex-feedback",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
