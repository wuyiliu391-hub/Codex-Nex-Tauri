[package]
name = "codex-tauri"
version = "0.1.0"
description = "Codex desktop shell (Tauri) powered by official codex-app-server sidecar"
authors = ["Codex Contributors"]
edition = "2021"
rust-version = "1.77"
workspace = "../codex-rust-v0.154.0/codex-rs"

[lib]
name = "codex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4"
cron = "0.12"
walkdir = "2"
regex = "1"

# ─── In-process native engine backend ─────────────────────────────────────────
codex-app-server          = { path = "../codex-rust-v0.154.0/codex-rs/app-server",          optional = true }
codex-app-server-protocol = { path = "../codex-rust-v0.154.0/codex-rs/app-server-protocol", optional = true }
codex-app-server-client   = { path = "../codex-rust-v0.154.0/codex-rs/app-server-client",   optional = true }
codex-protocol            = { path = "../codex-rust-v0.154.0/codex-rs/protocol",            optional = true }
codex-core                = { path = "../codex-rust-v0.154.0/codex-rs/core",                optional = true }
codex-config              = { path = "../codex-rust-v0.154.0/codex-rs/config",              optional = true }
codex-arg0                = { path = "../codex-rust-v0.154.0/codex-rs/arg0",                optional = true }
codex-exec-server         = { path = "../codex-rust-v0.154.0/codex-rs/exec-server",         optional = true }
codex-feedback            = { path = "../codex-rust-v0.154.0/codex-rs/feedback",            optional = true }

[features]
default = ["in-process"]
in-process = [
    "dep:codex-app-server",
    "dep:codex-app-server-protocol",
    "dep:codex-app-server-client",
    "dep:codex-protocol",
    "dep:codex-core",
    "dep:codex-config",
    "dep:codex-arg0",
    "dep:codex-exec-server",
    "dep:codex-feedback",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
