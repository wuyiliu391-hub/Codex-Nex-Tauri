[workspace]
members = [
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Internal
codex-tauri = { path = "src-tauri" }

# NOTE: dependency versions live in the member crate's own [dependencies]
# (src-tauri/Cargo.toml). This workspace previously carried ~250 declarations
# inherited from the vendored official engine source tree; that tree was
# removed when the self-developed in-process kernel replaced the sidecar, and
# the declarations were dead config (no member referenced them via
# `workspace = true`). They were deleted to keep dependency management honest:
# one place to look, no phantom dependencies.

[workspace.lints]
rust = {}

[workspace.lints.clippy]
# Correctness-adjacent lints that catch real bugs in a codebase this size.
await_holding_lock = "warn"
await_holding_invalid_type = "warn"
disallowed_methods = "warn"
# `unwrap`/`expect` are warnings, not errors: the kernel uses them only where a
# panic is genuinely impossible (poisoned-lock handling converts to a typed
# error instead), but the lint keeps new call sites visible in review.
unwrap_used = "warn"
expect_used = "warn"

# ── profiles ────────────────────────────────────────────────────────────────
# Only profiles that a script or workflow actually selects are kept. The former
# `dev-small`, `profiling`, `ci-test` and `ci-fast` entries had no caller:
# `ci-fast` in particular was reimplemented as CARGO_PROFILE_RELEASE_* env vars
# in build-fast.yml, which is how the Tauri CLI has to do it (tauri-cli 2.11
# has no --profile flag).

[profile.dev]
# Keep line tables/backtraces while avoiding expensive full variable debug info
# across local dev builds. build-debug.yml raises this to full symbols via
# CARGO_PROFILE_DEV_DEBUG=true.
debug = "limited"

[profile.release]
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "off"
# CI sets CARGO_PROFILE_RELEASE_STRIP=symbols. Keep symbols locally so a crash
# is symbolicateable; packaging strips them.
strip = false
# Balance parallel release code generation against binary size.
codegen-units = 4

# NOTE on [patch]: there is deliberately none.
#
# The previous entries redirected `crossterm`, `tokio-tungstenite` and
# `tungstenite` to openai-oss-forks git revisions. They were inherited from the
# vendored official engine tree, and no member depends on those crates any more
# (verified: zero references in src-tauri). A patch on an unused crate only
# costs a network clone on every cold build, so they are gone.
#
# If a dependency conflict ever requires a fork again, add a [patch.crates-io]
# table WITH a comment naming the conflict — an unexplained patch is what made
# these three hard to retire.
