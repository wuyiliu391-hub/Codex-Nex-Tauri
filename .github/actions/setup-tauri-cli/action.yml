name: setup-tauri-cli
description: >
  Install the Tauri CLI at a pinned version, with caching.

  Replaces three copies of the same 23-line cache/download/extract/PATH block
  that had drifted across build-fast.yml, build-release.yml and build-debug.yml.
  Centralising it means the pinned version lives in exactly one place
  (.github/actions/setup-tauri-cli/action.yml) instead of four workflow env
  blocks.

  Uses the prebuilt `cargo-tauri` zip rather than `cargo install tauri-cli`,
  which would compile the CLI from source on every cold run (~4-6 min).

inputs:
  version:
    description: "Tauri CLI version to install (e.g. 2.11.4)."
    required: true

runs:
  using: composite
  steps:
    - name: Cache Tauri CLI
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.tools
        key: cargo-tauri-${{ runner.os }}-${{ inputs.version }}

    - name: Download Tauri CLI ${{ inputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ver = "${{ inputs.version }}"
        $dir = Join-Path $env:GITHUB_WORKSPACE ".tools"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null

        $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
        $zip = Join-Path $dir "cargo-tauri.zip"
        Write-Host "GET $url"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        Remove-Item $zip -Force

        $exe = Join-Path $dir "cargo-tauri.exe"
        if (-not (Test-Path $exe)) { throw "cargo-tauri.exe not found after extracting $zip" }
        Write-Host ("installed cargo-tauri {0} ({1:N0} bytes)" -f $ver, (Get-Item $exe).Length)

    - name: Put Tauri CLI on PATH
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $dir = Join-Path $env:GITHUB_WORKSPACE ".tools"
        # tauri.conf.json / scripts invoke both `cargo tauri` and `cargo-tauri`,
        # so provide both names.
        Copy-Item (Join-Path $dir "cargo-tauri.exe") (Join-Path $dir "tauri.exe") -Force
        Add-Content -Path $env:GITHUB_PATH -Value $dir
