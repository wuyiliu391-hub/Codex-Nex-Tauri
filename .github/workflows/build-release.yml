name: build-release

# Formal release packaging (tag-triggered).
#
# Same strategy as build-fast: the self-developed kernel is compiled into the
# shell, so the release artifact is a single self-contained exe with no
# sidecar, no downloaded engine and no `binaries/` resource.
#
# Release profile: the root Cargo.toml `[profile.release]` (lto=thin,
# codegen-units=4). Unlike build-fast, we do NOT override it with
# CARGO_PROFILE_RELEASE_* here, and we do strip symbols for the shipped binary.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  # Release: strip symbols (build-fast keeps them out via DEBUG=0/STRIP=symbols).
  CARGO_PROFILE_RELEASE_STRIP: "symbols"
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_RW_MODE: "READ_WRITE"
  SCCACHE_VERSION: "v0.18.0"
  RUSTC_WRAPPER: sccache

jobs:
  build-release:
    name: Windows release (self-contained)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/check-frontend.mjs
          node scripts/verify-notification-coverage.mjs
          node scripts/verify-protocol-usage.mjs

      - name: Frontend — install + build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Rust (pinned 1.98.1, MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Export sccache GHA credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # `key: release` is distinct from build-fast's `key: fast` because the two
      # jobs compile with different release profiles (see build-fast.yml). A
      # shared target/ would make them evict each other's artifacts.
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-win
          key: release
          cache-targets: true
          cache-on-failure: true

      - name: Setup Tauri CLI
        uses: ./.github/actions/setup-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      # Release gate: refuse to publish if a sidecar engine has crept back in.
      - name: Assert no engine binary is bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw
          if ($conf -match "codex-app-server") {
            throw "tauri.conf.json still references codex-app-server; the kernel is in-process."
          }
          $stray = Get-ChildItem -Path "src-tauri/binaries" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($stray) {
            throw "found a stray engine binary: $($stray.FullName)"
          }
          Write-Host "OK: no engine binary in config or src-tauri/binaries"

      - name: cargo tauri build
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          sccache --version
          cargo tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          try { sccache --show-stats } catch { Write-Host "sccache stats unavailable" }

      - name: Stage portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/stage-dist.ps1

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Windows-Portable
          path: dist/
          if-no-files-found: error
          retention-days: 90
