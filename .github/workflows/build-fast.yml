name: build-fast

# Deep in-process engine compile is no longer the product/CI path.
# Daily builds: shell-only Tauri + official prebuilt engine sidecar.
#
# Architecture:
#   Frontend ──Tauri IPC──► src-tauri shell commands
#                              │
#                              └─► official codex-app-server.exe (sidecar WS)
#
# Desktop features (pets/calendar/settings/...) live in the shell layer.
# `in-process` is an optional Cargo feature only (default = []).
#
# Engine binary: openai/codex release rust-v0.154.0.
# tauri-cli 2.11.x: no --profile, no --no-default-features — pass cargo runner
# args after `--`. CARGO_PROFILE_RELEASE_* keeps artifacts in target/release/.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Binary is downloaded explicitly below; skip tauri sidecar existence check
  # so a cache miss fails the download step, not a silent tauri check.
  TAURI_SKIP_SIDECAR_CHECK: "1"
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  TOOLS_DIR: ${{ github.workspace }}/.tools
  # Official engine release (standalone app-server, x86_64 Windows).
  CODEX_APP_SERVER_TAG: "rust-v0.154.0"
  CODEX_APP_SERVER_NAME: "codex-app-server-x86_64-pc-windows-msvc.exe"
  CODEX_APP_SERVER_DIR: ${{ github.workspace }}/src-tauri/binaries
  # Fast release profile via env (default profile, target/release/).
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"
  CARGO_PROFILE_DEV_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_RW_MODE: "READ_WRITE"
  SCCACHE_VERSION: "v0.18.0"
  RUSTC_WRAPPER: sccache

jobs:
  build-fast:
    name: Windows shell + official app-server sidecar
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — dependency-free checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/check-frontend.mjs
          node scripts/verify-notification-coverage.mjs

      - name: Frontend — install
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund

      - name: Frontend — typecheck + build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build

      - name: Setup Rust (pinned 1.98.1, MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Export sccache GHA credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # Official engine binary (~230MB). Cached by release tag so push-to-push
      # CI does not re-download. Lives where sidecar resolve_sidecar_source()
      # already looks: src-tauri/binaries/<name>.exe (gitignored).
      - name: Cache official codex-app-server
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: ${{ env.CODEX_APP_SERVER_DIR }}/${{ env.CODEX_APP_SERVER_NAME }}
          key: codex-app-server-${{ env.CODEX_APP_SERVER_TAG }}-win-x64

      - name: Download official codex-app-server
        if: steps.cache-engine.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:CODEX_APP_SERVER_TAG
          $name = $env:CODEX_APP_SERVER_NAME
          $dir = $env:CODEX_APP_SERVER_DIR
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/openai/codex/releases/download/$tag/$name"
          $out = Join-Path $dir $name
          Write-Host "GET $url"
          Invoke-WebRequest -Uri $url -OutFile $out
          $item = Get-Item $out
          Write-Host ("downloaded {0} bytes={1}" -f $item.FullName, $item.Length)
          if ($item.Length -lt 10MB) { throw "engine binary looks too small: $($item.Length)" }

      - name: Shell-only rust-cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-win
          key: sidecar-shell
          cache-targets: true
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: true
          cache-bin: true
          add-job-id-key: false
          prefix-key: v0-rust

      - name: Cache prebuilt cargo-tauri
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Download cargo-tauri ${{ env.TAURI_CLI_VERSION }}
        if: steps.cache-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:TAURI_CLI_VERSION
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR | Out-Null
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:TOOLS_DIR "cargo-tauri.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TOOLS_DIR -Force
          Remove-Item $zip -Force
          $exe = Join-Path $env:TOOLS_DIR "cargo-tauri.exe"
          if (-not (Test-Path $exe)) { throw "cargo-tauri.exe not found after extract" }

      - name: Put cargo-tauri on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:TOOLS_DIR
          Copy-Item (Join-Path $env:TOOLS_DIR "cargo-tauri.exe") (Join-Path $env:TOOLS_DIR "tauri.exe") -Force

      # tauri-cli 2.11.x has no --no-default-features flag. Cargo runner args
      # go after `--`. default = [] already excludes in-process; the explicit
      # runner flag keeps CI shell-only even if Cargo.toml default changes.
      - name: cargo tauri build (shell + sidecar)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          sccache --version
          $engine = Join-Path $env:CODEX_APP_SERVER_DIR $env:CODEX_APP_SERVER_NAME
          if (-not (Test-Path $engine)) { throw "engine binary missing: $engine" }
          Write-Host "engine=$engine size=$((Get-Item $engine).Length)"
          cargo tauri build -- --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          try { sccache --show-stats } catch { Write-Host "sccache stats unavailable" }

      - name: Cache diagnostics
        if: always()
        shell: pwsh
        run: |
          Write-Host "engine cache-hit=${{ steps.cache-engine.outputs.cache-hit }}"
          Write-Host "rust-cache cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          $engine = Join-Path $env:CODEX_APP_SERVER_DIR $env:CODEX_APP_SERVER_NAME
          if (Test-Path $engine) {
            Write-Host "engine present: $((Get-Item $engine).Length) bytes"
          } else {
            Write-Host "engine MISSING"
          }

      - name: Upload fast exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-exe
          path: |
            **/target/release/Codex.exe
            **/target/release/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload fast installer
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-installers
          path: |
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7
