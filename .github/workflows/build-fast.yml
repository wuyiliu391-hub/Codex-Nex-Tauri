name: build-fast

# Daily Windows build.
#
# Architecture (self-developed kernel — no external engine binary):
#
#   Frontend ──Tauri IPC──► src-tauri shell commands
#                              │
#                              └─► src-tauri/src/kernel  (in-process)
#
# There is NO sidecar, NO downloaded engine and NO `binaries/` resource.
# The kernel is compiled into the shell binary, so the product is a single
# self-contained exe. Nothing here fetches codex-app-server.
#
# tauri-cli 2.11.x has no --profile flag — pass cargo runner args after `--`.
# CARGO_PROFILE_RELEASE_* keeps artifacts in target/release/.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  # Fast release profile via env (default profile, target/release/).
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"
  CARGO_PROFILE_DEV_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_RW_MODE: "READ_WRITE"
  SCCACHE_VERSION: "v0.18.0"
  RUSTC_WRAPPER: sccache

jobs:
  build-fast:
    name: Windows shell + self-developed kernel
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — dependency-free checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/check-frontend.mjs
          node scripts/verify-notification-coverage.mjs
          node scripts/verify-protocol-usage.mjs

      - name: Frontend — install
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund

      - name: Frontend — typecheck + build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build

      - name: Setup Rust (pinned 1.98.1, MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Export sccache GHA credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # shared-key groups the registry index across all Rust jobs so a fresh
      # checkout still finds the crates it needs. `key: fast` is distinct from
      # build-release's key on purpose: this job overrides the release profile
      # (opt-level=2, LTO off, codegen-units=256) while build-release uses the
      # root [profile.release] (LTO thin, codegen-units=4). Sharing one target/
      # between two different profiles makes them evict each other and
      # recompile from scratch on every run.
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-win
          key: fast
          cache-targets: true
          cache-on-failure: true

      - name: Setup Tauri CLI
        uses: ./.github/actions/setup-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      # Guard against the old sidecar pipeline creeping back in: if any of
      # these reappear the build fails loudly instead of silently shipping a
      # 300 MB engine again.
      - name: Assert no engine binary is bundled
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw
          if ($conf -match "codex-app-server") {
            throw "tauri.conf.json still references codex-app-server; the kernel is in-process."
          }
          $stray = Get-ChildItem -Path "src-tauri/binaries" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($stray) {
            throw "found a stray engine binary: $($stray.FullName)"
          }
          Write-Host "OK: no engine binary in config or src-tauri/binaries"

      - name: cargo tauri build
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          sccache --version
          cargo tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          try { sccache --show-stats } catch { Write-Host "sccache stats unavailable" }

      - name: Stage portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/stage-dist.ps1

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Windows-Portable
          path: dist/
          if-no-files-found: error
          retention-days: 7
