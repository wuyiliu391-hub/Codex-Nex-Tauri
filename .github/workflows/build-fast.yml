name: build-fast

# Daily iteration: a usable Tauri installer in the shortest possible wall-clock
# time. Shallow + recursive submodules, the ci-fast cargo profile (opt-level 2,
# no LTO, codegen-units 256), no tests, no lint. For a fully optimised,
# reproducible installer use build-release.yml.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_SKIP_SIDECAR_CHECK: "1"
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  TOOLS_DIR: ${{ github.workspace }}/.tools

jobs:
  build-fast:
    name: Windows exe (fast, ci-fast profile)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Shallow + recursive: the backend sources live in-tree now, but keep
      # recursive so any future nested submodule is fetched without changing CI.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — dependency-free checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/check-frontend.mjs
          node scripts/verify-notification-coverage.mjs

      - name: Frontend — install
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund

      - name: Frontend — typecheck + build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Shared cache key across build-fast and build-release so a release build
      # reuses everything the fast build already compiled.
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-win
          cache-workspace-crates: "true"
          cache-on-failure: true
          cache-bin: true

      - name: Cache prebuilt cargo-tauri
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Download cargo-tauri ${{ env.TAURI_CLI_VERSION }}
        if: steps.cache-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:TAURI_CLI_VERSION
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR | Out-Null
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:TOOLS_DIR "cargo-tauri.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TOOLS_DIR -Force
          Remove-Item $zip -Force
          $exe = Join-Path $env:TOOLS_DIR "cargo-tauri.exe"
          if (-not (Test-Path $exe)) { throw "cargo-tauri.exe not found after extract" }

      - name: Put cargo-tauri on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:TOOLS_DIR
          Copy-Item (Join-Path $env:TOOLS_DIR "cargo-tauri.exe") (Join-Path $env:TOOLS_DIR "tauri.exe") -Force

      # ci-fast: opt-level 2, no LTO, high codegen parallelism. Output lands in
      # target/ci-fast/ (not target/release/), which the artifact paths reflect.
      - name: cargo tauri build (ci-fast)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          cargo tauri build --profile ci-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload fast exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-exe
          path: |
            **/target/ci-fast/Codex.exe
            **/target/ci-fast/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload fast installer
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-installers
          path: |
            **/target/ci-fast/bundle/nsis/*.exe
            **/target/ci-fast/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7
