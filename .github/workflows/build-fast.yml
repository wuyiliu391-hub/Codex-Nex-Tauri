name: build-fast

# Daily iteration: a usable Tauri installer in the shortest possible wall-clock
# time. Shallow + recursive submodules, a fast override of the default cargo
# release profile (opt-level 2, no LTO, high codegen units), no tests, no lint.
# For a fully optimised, reproducible installer use build-release.yml.
#
# Why not `cargo tauri build --profile ci-fast`?
#   tauri-cli 2.11.x has no --profile flag (it rejects the arg). Passing
#   `-- --profile ci-fast` would compile under that profile, but the CLI still
#   looks for the binary under target/release/, so bundling fails. The official
#   Cargo way to speed up the release profile without renaming it is the
#   CARGO_PROFILE_RELEASE_* environment variables, which keeps artifacts in
#   target/release/ where tauri expects them.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_SKIP_SIDECAR_CHECK: "1"
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  TOOLS_DIR: ${{ github.workspace }}/.tools
  # Mirror of [profile.ci-fast] applied onto the default release profile so
  # `cargo tauri build` (no --profile) produces a fast binary in target/release.
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"

jobs:
  build-fast:
    name: Windows exe (fast, release profile override)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Shallow + recursive: the backend sources live in-tree now, but keep
      # recursive so any future nested submodule is fetched without changing CI.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — dependency-free checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/check-frontend.mjs
          node scripts/verify-notification-coverage.mjs

      - name: Frontend — install
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund

      - name: Frontend — typecheck + build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build

      # Pin the toolchain. `stable` floats — a new rustc release changes the
      # rust-cache key and forces a full recompile of the 100+ workspace crates.
      - name: Setup Rust (pinned 1.98.1, MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      # Swatinem/rust-cache — the project already used this (方案1). Keep it
      # aligned with the recommended knobs:
      #   workspaces: . -> target     cache the project target/ dir
      #   cache-targets: true         restore/save target (default, set explicit)
      #   cache-workspace-crates: true  also cache local codex-* workspace members
      #   shared-key: tauri-win       same key family as build-release
      #   cache-on-failure: true      save even when compile fails (so the next
      #                               job does not start from zero again)
      #
      # Cache key still includes Cargo.lock + rustc version + workspace member
      # Cargo.tomls + (by default) relevant env. Changing any of those, or the
      # first run after introducing CARGO_PROFILE_RELEASE_*, is a miss and looks
      # like "recompiling everything". That is Cargo + rust-cache normal, not a
      # missing cache step.
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-win
          cache-targets: true
          cache-workspace-crates: true
          cache-on-failure: true
          cache-bin: true

      - name: Cache prebuilt cargo-tauri
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Download cargo-tauri ${{ env.TAURI_CLI_VERSION }}
        if: steps.cache-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:TAURI_CLI_VERSION
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR | Out-Null
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:TOOLS_DIR "cargo-tauri.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TOOLS_DIR -Force
          Remove-Item $zip -Force
          $exe = Join-Path $env:TOOLS_DIR "cargo-tauri.exe"
          if (-not (Test-Path $exe)) { throw "cargo-tauri.exe not found after extract" }

      - name: Put cargo-tauri on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:TOOLS_DIR
          Copy-Item (Join-Path $env:TOOLS_DIR "cargo-tauri.exe") (Join-Path $env:TOOLS_DIR "tauri.exe") -Force

      # Default release profile, overridden by CARGO_PROFILE_RELEASE_* above.
      # Output and bundles land in target/release/ (not target/ci-fast/).
      - name: cargo tauri build (fast release)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          cargo tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload fast exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-exe
          path: |
            **/target/release/Codex.exe
            **/target/release/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload fast installer
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-installers
          path: |
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7
