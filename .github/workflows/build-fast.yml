name: build-fast

# Daily iteration: a usable Tauri installer in the shortest possible wall-clock
# time. Community cache stack (see docs/compose/change-notes/ci-cache-stack.md):
#   1. Pin rustc (stable floats → rust-cache key thrash)
#   2. Swatinem/rust-cache: target + workspace crates + shared-key
#   3. Kill debuginfo so target/ stays small (Tauri official does this too)
#   4. mozilla sccache GHA backend — rustc-invocation cache on top of rust-cache
#
# Why not `cargo tauri build --profile ci-fast`?
#   tauri-cli 2.11.x has no --profile flag. CARGO_PROFILE_RELEASE_* env vars
#   speed up the default release profile; artifacts stay in target/release/.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_SKIP_SIDECAR_CHECK: "1"
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # sccache docs: cargo incremental must be off when RUSTC_WRAPPER is sccache.
  CARGO_INCREMENTAL: "0"
  TOOLS_DIR: ${{ github.workspace }}/.tools
  # ── debuginfo off (smaller target, better cache hit rate) ──
  # Same knobs Tauri official CI uses; CARGO_PROFILE_* is also hashed into
  # the Swatinem cache key via the CARGO env prefix — keep them stable.
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # ── sccache → GitHub Actions cache backend ──
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_RW_MODE: "READ_WRITE"
  SCCACHE_VERSION: "0.18.0"
  RUSTC_WRAPPER: sccache

jobs:
  build-fast:
    name: Windows exe (fast, release profile override)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — dependency-free checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/check-frontend.mjs
          node scripts/verify-notification-coverage.mjs

      - name: Frontend — install
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund

      - name: Frontend — typecheck + build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build

      # 1) Pin rustc BEFORE rust-cache / sccache — both key off the compiler.
      - name: Setup Rust (pinned 1.98.1, MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      # 2) sccache GHA backend credentials (mozilla docs/GHA.md).
      - name: Export sccache GHA credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # 3) Swatinem/rust-cache — registry + target + local workspace crates.
      #    add-job-id-key: false + shared-key keep one key family with
      #    build-release. The extra `key: release-fast` differs from
      #    release-full on purpose: profiles differ, sharing one target would
      #    thrash fingerprints. Restore may still fall back on prefix-key.
      - name: Cache cargo registry & target
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-win
          key: release-fast
          cache-targets: true
          cache-workspace-crates: true
          cache-all-crates: false
          cache-on-failure: true
          cache-bin: true
          add-job-id-key: false
          prefix-key: v0-rust

      - name: Cache prebuilt cargo-tauri
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Download cargo-tauri ${{ env.TAURI_CLI_VERSION }}
        if: steps.cache-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:TAURI_CLI_VERSION
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR | Out-Null
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:TOOLS_DIR "cargo-tauri.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TOOLS_DIR -Force
          Remove-Item $zip -Force
          $exe = Join-Path $env:TOOLS_DIR "cargo-tauri.exe"
          if (-not (Test-Path $exe)) { throw "cargo-tauri.exe not found after extract" }

      - name: Put cargo-tauri on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:TOOLS_DIR
          Copy-Item (Join-Path $env:TOOLS_DIR "cargo-tauri.exe") (Join-Path $env:TOOLS_DIR "tauri.exe") -Force

      - name: cargo tauri build (fast release + sccache)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          sccache --version
          cargo tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: sccache stats
        if: always()
        shell: pwsh
        run: |
          try { sccache --show-stats } catch { Write-Host "sccache stats unavailable" }

      - name: rust-cache hit
        if: always()
        shell: pwsh
        run: Write-Host "rust-cache cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: Upload fast exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-exe
          path: |
            **/target/release/Codex.exe
            **/target/release/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload fast installer
        uses: actions/upload-artifact@v4
        with:
          name: Codex-fast-installers
          path: |
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7
