name: build-debug

# Debug build with full symbols, for crash triage and profiling.
#
# Uses `cargo tauri build --debug`, which drives the same pipeline as the
# release build but with the `dev` profile. The root Cargo.toml sets
# `[profile.dev] debug = "limited"`; the env overrides below raise that to full
# symbols for this workflow only.
#
# Output is `target/debug/Codex.exe` (Tauri renames the binary to
# `productName` from tauri.conf.json — the Cargo package is `codex-tauri`, so
# the raw cargo artifact is `codex-tauri.exe`; we let the Tauri CLI do the
# rename rather than guessing).
#
# No sidecar: the self-developed kernel is compiled into the shell.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "1"
  # Full symbols for triage; the dev profile defaults to "limited".
  CARGO_PROFILE_DEV_DEBUG: "true"
  CARGO_PROFILE_DEV_STRIP: "false"
  # sccache: a debug profile recompiles dependencies that the release profile
  # also needs, so sharing the compiler cache across workflows is the single
  # biggest win for this job.
  SCCACHE_GHA_ENABLED: "on"
  SCCACHE_GHA_RW_MODE: "READ_WRITE"
  SCCACHE_VERSION: "v0.18.0"
  RUSTC_WRAPPER: sccache

jobs:
  build-debug:
    name: Windows debug build with full symbols
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The debug build must compile the frontend: `tauri.conf.json`
      # `frontendDist` points at ../frontend/dist, which is gitignored and
      # therefore absent on a fresh checkout.
      - name: Frontend — install + build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Rust (pinned 1.98.1, MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Export sccache GHA credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # shared-key matches build-fast/build-release so the debug job reuses the
      # same ~/.cargo/registry and target/ skeleton. `key` differs because the
      # profile differs (dev vs release) — sharing those artifacts would poison
      # the cache with the wrong opt-level/debug settings.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tauri-win
          key: debug
          cache-targets: true
          cache-on-failure: true

      - name: Setup Tauri CLI
        uses: ./.github/actions/setup-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      - name: cargo tauri build --debug
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          cargo tauri build --debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Resolve the artifacts by glob rather than a guessed name: the Tauri CLI
      # renames the binary to `productName` ("Codex"), while a plain cargo
      # build would emit `codex-tauri.exe`. Globbing is correct either way.
      - name: Package debug artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = $env:CARGO_TARGET_DIR
          $bin = Get-ChildItem -Path (Join-Path $target "debug") -Filter "*.exe" -File |
                 Where-Object { $_.Name -notmatch 'build-script|deps' } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $bin) { throw "no exe found under $target/debug" }

          $out = Join-Path $env:GITHUB_WORKSPACE "dist-debug"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $bin.FullName -Destination $out -Force
          Write-Host "staged $($bin.Name) ($([math]::Round($bin.Length/1MB,1)) MB)"

          # A .pdb sits next to the exe when debug info is on.
          $pdb = Join-Path $bin.DirectoryName ($bin.BaseName + ".pdb")
          if (Test-Path $pdb) {
            Copy-Item $pdb -Destination $out -Force
            Write-Host "staged $($bin.BaseName).pdb"
          } else {
            Write-Host "no .pdb beside $($bin.Name) (debug info may be embedded)"
          }
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name) $($_.Length) bytes" }

      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Windows-Debug
          path: dist-debug/
          if-no-files-found: error
          retention-days: 7
