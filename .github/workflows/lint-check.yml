name: lint-check

# Fast, dependency-light quality gate. Runs in parallel with the build
# workflows and never blocks them. Frontend checks are dependency-free scripts
# plus npm typecheck; the Rust side is formatting only.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: lint-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend-checks:
    name: Frontend static checks
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dependency-free: parses .ts, structurally checks .tsx, resolves imports.
      - name: Frontend — dependency-free checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/check-frontend.mjs
          node scripts/verify-notification-coverage.mjs
          node scripts/migration-status.mjs

      - name: Frontend — install + typecheck
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund
          npm run typecheck

  rust-fmt:
    name: Rust formatting
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pin rustfmt to the same toolchain as the build workflows so format
      # checks do not drift when GitHub `stable` advances.
      - name: Setup Rust (pinned 1.98.1, rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt

      # Formatting only — no compilation, so it stays fast and independent of
      # the heavy backend workspace.
      - name: cargo fmt --check (src-tauri)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
