name: ci

# Continuous integration, following the official Tauri GitHub Actions guide:
#   https://v2.tauri.app/distribute/pipelines/github/
#
# Caching is three layers, each covering something the others cannot:
#
#   sccache (mozilla-actions/sccache-action)
#       Caches individual compilation units keyed by source content, so an
#       unchanged crate never invokes rustc. Stored in the GitHub Actions cache.
#       Per https://github.com/mozilla/sccache/blob/main/docs/GHA.md this needs
#       SCCACHE_GHA_ENABLED=on AND the ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN
#       variables exported, otherwise it silently does nothing.
#
#   Swatinem/rust-cache
#       Caches ~/.cargo/registry (dependency downloads + crates.io index) and the
#       target/ skeleton. sccache never sees `cargo fetch`, so it cannot cover
#       this.
#
#   tauri-apps/tauri-action
#       Installs and runs the Tauri CLI itself, so no CLI download script is
#       maintained here.
#
# `workspaces: './src-tauri -> target'` is NOT optional. The official Tauri docs
# call this out for repos where the app is not at the repo root, and this repo is
# exactly that shape (frontend/ + src-tauri/). Pointing it at `.` would cache the
# wrong directory and silently do nothing.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sccache: route rustc through it and store objects in the GHA cache.
  # `on` (not `true`) is the documented value.
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: sccache

jobs:
  # ── checks ────────────────────────────────────────────────────────────────
  # Frontend typecheck + kernel unit tests. These run before the (slow) Tauri
  # build so a broken commit fails in ~2 minutes instead of ~20.
  checks:
    name: checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      # `tauri::generate_context!` embeds `frontendDist` at compile time, so
      # frontend/dist must exist before any cargo command. The Tauri build job
      # below rebuilds it via tauri-action, but the test step here needs it too.
      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      # sccache must be set up BEFORE any cargo invocation, and the two GHA
      # token variables must be exported for the cache backend to work — see
      # https://github.com/mozilla/sccache/blob/main/docs/GHA.md. Without them
      # sccache installs fine and then silently caches nothing.
      - name: configure sccache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Matches this repo's layout (frontend/ + src-tauri/), per the
          # official guide. `workspaces: .` would be wrong here.
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      # Cargo.lock is committed at the REPO ROOT (the workspace root), not in
      # src-tauri/. Once it exists, every cargo command below runs with
      # `--locked`, which makes Cargo refuse to silently re-resolve versions —
      # that is what turns "CI failed for an external reason" into "CI failed
      # because of a commit".
      #
      # Until the file exists this warns instead of failing, so the pipeline is
      # usable while the one-time bootstrap (workflows/generate-lockfile.yml)
      # has not been run yet. The warning is deliberately loud: an unlocked
      # resolve is exactly the flakiness the lockfile is meant to remove.
      - name: detect Cargo.lock
        id: lock
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            echo "flags=--locked" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock present: $(grep -c '^\[\[package\]\]' Cargo.lock) packages pinned"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Cargo.lock::Dependency versions are unpinned. Run the 'generate-lockfile' workflow and commit the result."
          fi

      - name: cargo test (kernel)
        working-directory: src-tauri
        run: cargo test --lib ${{ steps.lock.outputs.flags }}

      # Formatting and lints report but do not gate.
      #
      # This repo has never been run through `cargo fmt` and the author has no
      # local Rust toolchain, so there are ~19 over-long lines that rustfmt
      # would reflow. Gating on them would make CI permanently red, which is
      # worse than reporting. They still print, so the first contributor with a
      # toolchain can fix and promote them.
      - name: cargo fmt (report only)
        working-directory: src-tauri
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy (report only)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

      # Prints hit/miss counts so a cache regression is visible in the log
      # rather than guessed at. The action also runs this in its post step; doing
      # it explicitly keeps the numbers next to the build that produced them.
      - name: sccache stats
        if: always()
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  # ── build ─────────────────────────────────────────────────────────────────
  # Verifies the app actually bundles, using the official action. No release is
  # created: `tagName`/`releaseName`/`releaseId` are omitted on purpose, which
  # the action documents as the "build only" mode.
  #
  # Windows only for now. Adding macOS/Linux means adding a `matrix` as in the
  # official example — deliberately deferred, because the product is
  # Windows-first (see the kernel's Windows-specific notes) and an untested
  # platform entry is worse than none.
  build:
    name: build (windows)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      # Same sccache wiring as the checks job. Sharing the compiler cache across
      # jobs is the main win: this job's release-profile build reuses the
      # dependency objects the checks job already compiled.
      - name: configure sccache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Distinct from the checks job: the checks job runs a dev-profile
          # `cargo test`, this one a release-profile `cargo tauri build`.
          # Sharing one key would make the two evict each other's artifacts.
          key: build
          cache-on-failure: true

      # Same lock detection as the checks job; see the comment there.
      - name: detect Cargo.lock
        id: lock
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            echo "flags=--locked" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock present: $(grep -c '^\[\[package\]\]' Cargo.lock) packages pinned"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Cargo.lock::Dependency versions are unpinned. Run the 'generate-lockfile' workflow and commit the result."
          fi

      # The action installs the Tauri CLI itself and runs `tauri build`.
      #
      # The frontend is NOT built here: `tauri.conf.json` sets
      # `beforeBuildCommand` to `npm --prefix ../frontend run build`, so the
      # Tauri CLI builds it as part of `tauri build`. This mirrors the official
      # guide ("install the frontend dependencies and, if not configured as
      # beforeBuildCommand, run the web app's build script") and keeps local
      # and CI builds on the same code path.
      #
      # `args` forwards to `tauri build`, which forwards unknown flags to cargo,
      # so `--locked` reaches the real build. It is omitted while Cargo.lock is
      # absent (see the step above).
      #
      # `projectPath` is omitted on purpose: its default is `./`, and the
      # official guide defines it as "the path to the root of the tauri
      # project" — i.e. the directory *containing* `src-tauri/`. Here that is
      # the repo root. (The official example passes a nested path because its
      # fixture lives under `.github/fixtures/`, not because projectPath points
      # at `src-tauri` itself — `projectPath: src-tauri` would make the action
      # look for `src-tauri/src-tauri/`.)
      #
      # No tagName/releaseName/releaseId: the action documents that omitting
      # them means "build only, upload nothing".
      - id: build
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ steps.lock.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The colon inside the echoed string must not be followed by a space, or
      # YAML reads `run:`'s value as a nested mapping and rejects the whole file
      # — which fails the workflow at parse time with **zero jobs created**, so
      # nothing ever compiles and no annotation explains why.
      - name: report artifacts
        run: echo "tauri-action produced ${{ steps.build.outputs.artifactPaths }}"

      - name: upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/codex-tauri.exe
          if-no-files-found: warn
