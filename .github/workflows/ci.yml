name: ci

# Continuous integration, following the official Tauri GitHub Actions guide:
#   https://v2.tauri.app/distribute/pipelines/github/
#
# Why this file looks the way it does — the three decisions that matter:
#
#  1. Build with `tauri-apps/tauri-action`, not a hand-rolled `cargo tauri
#     build`. The official action installs the correct CLI version, runs the
#     build, and can publish a release — three things this repo previously
#     reimplemented by hand (a CLI zip download, a stage-dist script, and no
#     release step at all).
#
#  2. Cache with `Swatinem/rust-cache` and `dtolnay/rust-toolchain`, which is
#     what the official guide uses. sccache is deliberately NOT used here: the
#     official pipeline does not use it, and adding it means one more moving
#     part whose configuration (SCCACHE_GHA_ENABLED + RUSTC_WRAPPER) is easy to
#     get silently wrong. rust-cache covers the common case.
#
#  3. `workspaces: './src-tauri -> target'` is NOT optional. The official docs
#     call this out for repos where the Tauri app is not at the repo root, and
#     this repo is exactly that shape (frontend/ + src-tauri/). Pointing it at
#     `.` would cache the wrong directory and silently do nothing.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── checks ────────────────────────────────────────────────────────────────
  # Frontend typecheck + kernel unit tests. These run before the (slow) Tauri
  # build so a broken commit fails in ~2 minutes instead of ~20.
  checks:
    name: checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      # `tauri::generate_context!` embeds `frontendDist` at compile time, so
      # frontend/dist must exist before any cargo command. The Tauri build job
      # below rebuilds it via tauri-action, but the test step here needs it too.
      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Matches this repo's layout (frontend/ + src-tauri/), per the
          # official guide. `workspaces: .` would be wrong here.
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: cargo test (kernel)
        working-directory: src-tauri
        run: cargo test --lib

      # Formatting and lints report but do not gate.
      #
      # This repo has never been run through `cargo fmt` and the author has no
      # local Rust toolchain, so there are ~19 over-long lines that rustfmt
      # would reflow. Gating on them would make CI permanently red, which is
      # worse than reporting. They still print, so the first contributor with a
      # toolchain can fix and promote them.
      - name: cargo fmt (report only)
        working-directory: src-tauri
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy (report only)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  # ── build ─────────────────────────────────────────────────────────────────
  # Verifies the app actually bundles, using the official action. No release is
  # created: `tagName`/`releaseName`/`releaseId` are omitted on purpose, which
  # the action documents as the "build only" mode.
  #
  # Windows only for now. Adding macOS/Linux means adding a `matrix` as in the
  # official example — deliberately deferred, because the product is
  # Windows-first (see the kernel's Windows-specific notes) and an untested
  # platform entry is worse than none.
  build:
    name: build (windows)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Distinct from the checks job: the checks job runs a dev-profile
          # `cargo test`, this one a release-profile `cargo tauri build`.
          # Sharing one key would make the two evict each other's artifacts.
          key: build
          cache-on-failure: true

      # The action installs the Tauri CLI itself and runs `tauri build`.
      #
      # The frontend is NOT built here: `tauri.conf.json` sets
      # `beforeBuildCommand` to `npm --prefix ../frontend run build`, so the
      # Tauri CLI builds it as part of `tauri build`. This mirrors the official
      # guide ("install the frontend dependencies and, if not configured as
      # beforeBuildCommand, run the web app's build script") and keeps local
      # and CI builds on the same code path.
      #
      # `projectPath` is omitted on purpose: its default is `./`, and the
      # official guide defines it as "the path to the root of the tauri
      # project" — i.e. the directory *containing* `src-tauri/`. Here that is
      # the repo root. (The official example passes a nested path because its
      # fixture lives under `.github/fixtures/`, not because projectPath points
      # at `src-tauri` itself — `projectPath: src-tauri` would make the action
      # look for `src-tauri/src-tauri/`.)
      #
      # No tagName/releaseName/releaseId: the action documents that omitting
      # them means "build only, upload nothing".
      - id: build
        uses: tauri-apps/tauri-action@v1
        with:
          args: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: report artifacts
        run: echo "tauri-action produced: ${{ steps.build.outputs.artifactPaths }}"
