name: build-windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TAURI_SKIP_SIDECAR_CHECK: "1"
  # Cache key only — do not pin a non-existent crate version.
  TAURI_CLI_CACHE_KEY: "tauri-cli-v2-latest"

jobs:
  build:
    name: Windows exe (Tauri)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Registry + target/ incremental. Key on lockfile so deps only rebuild when deps change.
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-win-release
          cache-on-failure: true
          # Also cache ~/.cargo/bin so tauri.exe survives between runs.
          cache-bin: true

      # Dedicated cache for the tauri CLI binary (cargo install is the slow part).
      - name: Cache tauri-cli binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/bin/tauri.exe
            ${{ env.USERPROFILE }}/.cargo/bin/tauri.exe
          key: ${{ env.TAURI_CLI_CACHE_KEY }}-${{ runner.os }}

      - name: Install Tauri CLI (only if missing)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tauri = Get-Command tauri -ErrorAction SilentlyContinue
          if ($tauri -and $tauri.Source) {
            Write-Host "tauri CLI already at $($tauri.Source) — skip install"
            & $tauri.Source --version
            exit 0
          }
          Write-Host "installing tauri-cli (2.x latest, locked)"
          cargo install tauri-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tauri --version

      - name: Prepare icons (placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32,32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(242,242,242))
          $g.FillEllipse([System.Drawing.Brushes]::Black, 6, 6, 20, 20)
          $g.Dispose()
          $bmp.Save("src-tauri/icons/32x32.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp128 = New-Object System.Drawing.Bitmap 128,128
          $g2 = [System.Drawing.Graphics]::FromImage($bmp128)
          $g2.Clear([System.Drawing.Color]::FromArgb(242,242,242))
          $g2.FillEllipse([System.Drawing.Brushes]::Black, 24, 24, 80, 80)
          $g2.Dispose()
          $bmp128.Save("src-tauri/icons/128x128.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save("src-tauri/icons/icon.ico", [System.Drawing.Imaging.ImageFormat]::Icon)
          $bmp.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "icons ready"

      # Single compile path: tauri build runs rustc under release and produces the exe.
      # Do NOT cargo check + cargo build + tauri build (that triples cold work).
      - name: tauri build
        working-directory: src-tauri
        shell: pwsh
        run: cargo tauri build

      - name: Upload Codex.exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-exe
          path: |
            src-tauri/target/release/Codex.exe
            src-tauri/target/release/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
