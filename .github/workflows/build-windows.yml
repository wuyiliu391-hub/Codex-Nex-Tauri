name: build-windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TAURI_SKIP_SIDECAR_CHECK: "1"
  # Stable as of crates.io 2026-09: max_stable_version=2.11.4
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  # Prebuilt CLI lives outside CARGO_HOME so rust-cache does not thrash it.
  TOOLS_DIR: ${{ github.workspace }}/.tools

jobs:
  build:
    name: Windows exe (Tauri)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Registry + target incremental. Key on Cargo.lock so deps only rebuild
      # when dependencies change. Same branch reuses this across workflow runs.
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-win-release
          cache-on-failure: true
          cache-bin: true

      # Prebuilt cargo-tauri from GitHub Releases (seconds) instead of cargo install (minutes).
      - name: Cache prebuilt cargo-tauri
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Download cargo-tauri ${{ env.TAURI_CLI_VERSION }}
        if: steps.cache-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:TAURI_CLI_VERSION
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR | Out-Null
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:TOOLS_DIR "cargo-tauri.zip"
          Write-Host "GET $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TOOLS_DIR -Force
          Remove-Item $zip -Force
          $exe = Join-Path $env:TOOLS_DIR "cargo-tauri.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem $env:TOOLS_DIR -Recurse | Select-Object FullName
            throw "cargo-tauri.exe not found after extract"
          }
          & $exe --version

      - name: Put cargo-tauri on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:TOOLS_DIR
          # Also expose as `tauri` alias if anything still calls it bare.
          Copy-Item (Join-Path $env:TOOLS_DIR "cargo-tauri.exe") (Join-Path $env:TOOLS_DIR "tauri.exe") -Force

      - name: Prepare icons (placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32,32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(242,242,242))
          $g.FillEllipse([System.Drawing.Brushes]::Black, 6, 6, 20, 20)
          $g.Dispose()
          $bmp.Save("src-tauri/icons/32x32.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp128 = New-Object System.Drawing.Bitmap 128,128
          $g2 = [System.Drawing.Graphics]::FromImage($bmp128)
          $g2.Clear([System.Drawing.Color]::FromArgb(242,242,242))
          $g2.FillEllipse([System.Drawing.Brushes]::Black, 24, 24, 80, 80)
          $g2.Dispose()
          $bmp128.Save("src-tauri/icons/128x128.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save("src-tauri/icons/icon.ico", [System.Drawing.Imaging.ImageFormat]::Icon)
          $bmp.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "icons ready"

      # Binary is cargo-tauri; invoke as `cargo tauri` (cargo subcommand) or cargo-tauri.
      - name: cargo tauri build
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          cargo tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Codex.exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-exe
          path: |
            src-tauri/target/release/Codex.exe
            src-tauri/target/release/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
