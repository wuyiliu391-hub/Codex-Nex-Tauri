name: build-windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_sidecar:
        description: "Also build official codex-app-server (needs CODEX_RUST_PATH)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  TAURI_SKIP_SIDECAR_CHECK: "1"
  # Stable as of crates.io 2026-09: max_stable_version=2.11.4
  TAURI_CLI_VERSION: "2.11.4"
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  # Prebuilt CLI lives outside CARGO_HOME so rust-cache does not thrash it.
  TOOLS_DIR: ${{ github.workspace }}/.tools

jobs:
  build:
    name: Windows exe (Tauri)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Registry + target incremental. Key on Cargo.lock so deps only rebuild
      # when dependencies change. Same branch reuses this across workflow runs.
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-win-release
          cache-on-failure: true
          cache-bin: true

      # Prebuilt cargo-tauri from GitHub Releases (seconds) instead of cargo install (minutes).
      - name: Cache prebuilt cargo-tauri
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Download cargo-tauri ${{ env.TAURI_CLI_VERSION }}
        if: steps.cache-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:TAURI_CLI_VERSION
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR | Out-Null
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:TOOLS_DIR "cargo-tauri.zip"
          Write-Host "GET $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TOOLS_DIR -Force
          Remove-Item $zip -Force
          $exe = Join-Path $env:TOOLS_DIR "cargo-tauri.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem $env:TOOLS_DIR -Recurse | Select-Object FullName
            throw "cargo-tauri.exe not found after extract"
          }
          & $exe --version

      - name: Put cargo-tauri on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:TOOLS_DIR
          # Also expose as `tauri` alias if anything still calls it bare.
          Copy-Item (Join-Path $env:TOOLS_DIR "cargo-tauri.exe") (Join-Path $env:TOOLS_DIR "tauri.exe") -Force

      # Icons are committed under src-tauri/icons/ (valid multi-size ICO).
      # Do NOT regenerate with System.Drawing — RC.EXE rejects that fake ICO.

      # Binary is cargo-tauri; invoke as `cargo tauri` (cargo subcommand) or cargo-tauri.
      - name: cargo tauri build
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo-tauri --version
          cargo tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Codex.exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-exe
          path: |
            src-tauri/target/release/Codex.exe
            src-tauri/target/release/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

  # Optional: build the official codex-app-server sidecar.
  # Only runs when the official tree is available (workflow_dispatch input or
  # a checked-out CODEX_RUST_PATH). Does NOT block the shell-only job above.
  build-sidecar:
    name: Windows sidecar (codex-app-server)
    runs-on: windows-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && inputs.build_sidecar == true
    continue-on-error: true

    steps:
      - name: Checkout Codex-Tauri
        uses: actions/checkout@v4
        with:
          path: Codex-Tauri

      # The official tree is NOT vendored. Provide it via a private action,
      # cache, or self-hosted runner with CODEX_RUST_PATH set. This job is a
      # scaffold — fill in the fetch step for your environment.
      - name: Checkout official codex-rust (placeholder)
        id: codex_rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = $env:CODEX_RUST_PATH
          if (-not $path) {
            Write-Host "::notice::CODEX_RUST_PATH not set; sidecar job is a no-op scaffold."
            Write-Host "Provide the official v0.154.0 tree at ../codex-rust-v0.154.0/codex-rs"
            "available=false" >> $env:GITHUB_OUTPUT
          } else {
            "available=true" >> $env:GITHUB_OUTPUT
            "path=$path" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Rust
        if: steps.codex_rust.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build sidecar
        if: steps.codex_rust.outputs.available == 'true'
        working-directory: Codex-Tauri
        shell: pwsh
        run: |
          $env:CODEX_RUST_PATH = "${{ steps.codex_rust.outputs.path }}"
          .\scripts\build-sidecar.ps1

      - name: Upload sidecar
        if: steps.codex_rust.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-server-sidecar
          path: Codex-Tauri/src-tauri/binaries/codex-app-server*.exe
          if-no-files-found: warn
          retention-days: 14
