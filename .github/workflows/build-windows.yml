name: build-windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Skip sidecar-dependent runtime; still produce a runnable shell exe.
  TAURI_SKIP_SIDECAR_CHECK: "1"

jobs:
  build:
    name: Windows exe (Tauri)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
        shell: pwsh

      - name: Prepare icons (placeholder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          # Minimal 32x32 PNG (valid header + IHDR + IDAT + IEND) via .NET
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32,32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(242,242,242))
          $g.FillEllipse([System.Drawing.Brushes]::Black, 6, 6, 20, 20)
          $g.Dispose()
          $bmp.Save("src-tauri/icons/32x32.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp128 = New-Object System.Drawing.Bitmap 128,128
          $g2 = [System.Drawing.Graphics]::FromImage($bmp128)
          $g2.Clear([System.Drawing.Color]::FromArgb(242,242,242))
          $g2.FillEllipse([System.Drawing.Brushes]::Black, 24, 24, 80, 80)
          $g2.Dispose()
          $bmp128.Save("src-tauri/icons/128x128.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save("src-tauri/icons/icon.ico", [System.Drawing.Imaging.ImageFormat]::Icon)
          # 256 for store-style
          $bmp.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "icons ready"

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --message-format=short
        shell: pwsh

      - name: cargo build (release binary)
        working-directory: src-tauri
        run: cargo build --release
        shell: pwsh

      - name: tauri build (NSIS/MSI bundle)
        working-directory: src-tauri
        run: cargo tauri build
        shell: pwsh
        continue-on-error: true

      - name: Upload Codex.exe
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-exe
          path: |
            src-tauri/target/release/Codex.exe
            src-tauri/target/release/codex-tauri.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Codex-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
